<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone Interactive Simulator</title>
  <style>
    :root {
      --bg-wallpaper: linear-gradient(160deg, #0f3d2e 0%, #071e17 50%, #020a08 100%);
      --glass: rgba(255, 255, 255, 0.16);
      --glass-dark: rgba(20, 20, 24, 0.78);
      --text-main: #ffffff;
      --accent: #0a84ff;
      --green: #30d158;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #111318;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }
    /* إطار الآيفون */
    .iphone-frame {
      width: 100%;
      max-width: 393px;
      height: 820px;
      max-height: 95vh;
      background: #000;
      border-radius: 52px;
      padding: 12px;
      box-shadow: 0 0 0 3px #3a3d45, 0 25px 60px rgba(0, 0, 0, 0.85);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 41px;
      background: var(--bg-wallpaper);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
    }
    /* الشريط العلوي والجزيرة التفاعلية */
    .status-bar {
      height: 46px;
      padding: 10px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      cursor: pointer;
    }
    .dynamic-island {
      width: 112px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      transition: all 0.3s ease;
    }
    .dynamic-island.expanded {
      width: 240px;
      height: 44px;
    }
    .camera-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1a2436;
      border: 1px solid #2c3e50;
    }
    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    /* شاشة القفل */
    .lock-screen {
      position: absolute;
      inset: 0;
      padding: 58px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 30;
      background: inherit;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }
    .lock-screen.unlocked {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .lock-icon { font-size: 18px; margin-bottom: 6px; opacity: 0.9; }
    .lock-date { font-size: 18px; font-weight: 500; opacity: 0.92; }
    .lock-time { font-size: 82px; font-weight: 700; letter-spacing: -2px; line-height: 1.05; margin-bottom: 28px; }
    .notif-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: auto;
    }
    .notif-card {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    .notif-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .notif-body h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .notif-body p { font-size: 13px; opacity: 0.88; }
    .lock-bottom {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px 14px;
    }
    .circle-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      border: none;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .unlock-btn {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* الشاشة الرئيسية */
    .home-screen {
      flex: 1;
      padding: 16px 20px 84px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }
    .owner-banner {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .owner-banner h3 { font-size: 16px; font-weight: 700; }
    .owner-banner span { font-size: 12px; opacity: 0.85; }
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
      margin-bottom: auto;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .app-item:active { transform: scale(0.9); }
    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }
    .app-label {
      font-size: 11.5px;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    /* الشريط السفلي Dock */
    .dock {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      height: 78px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 28px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      z-index: 15;
    }

    /* شريط الرجوع السفلي Home Indicator */
    .home-indicator-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      cursor: pointer;
